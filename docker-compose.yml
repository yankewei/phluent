services:
  php:
    build:
      context: .
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: ["sleep", "infinity"]
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data:/data
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
